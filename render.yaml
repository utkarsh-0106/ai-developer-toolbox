services:
  - type: web
    name: ai-developer-toolbox-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: AI_PROVIDER
        value: gemini

      - key: GEMINI_MODEL
        value: gemini-3.8-flash

      - key: AI_FALLBACK_PROVIDERS
        value: ""

      - key: MONGO_URI
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: FRONTEND_ORIGIN
        sync: false
